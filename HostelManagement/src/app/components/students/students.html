<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">

      <!-- Main Card -->
      <div class="card border-0 shadow-sm">

        <!-- Header -->
        <div class="card-header bg-white border-0 p-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

            <div>
              <h3 class="mb-1 fw-bold text-dark">Students List</h3>
              <p class="text-muted mb-0">
                Manage and view all student records
              </p>
            </div>

            <div class="d-flex gap-2">
             

              <button
                type="button"
                class="btn btn-primary px-4"
                (click)="AddOrUpdateStudentComponent('', {}, 'Add Student Details')">
                <i class="bi bi-plus-lg me-2"></i>
                Add Student
              </button>
            </div>

          </div>
        </div>

        <!-- Search / Filter -->
        <div class="px-4 pb-3">
          <div class="row g-2">

            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white">
                  <i class="bi bi-search"></i>
                </span>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Search students..." (input)="onSearchChange($event.target.value)">
              </div>
            </div>

            <div class="col-md-3">
              <select class="form-select" (change)="onStatusYearChange($any($event.target).value)">
                <option value="0" selected>All Years</option>
                <option value="1">Year 1</option>
                <option value="2">Year 2</option>
                <option value="3">Year 3</option>
                <option value="4">Year 4</option>
              </select>
            </div>

            <div class="col-md-3">
              <select class="form-select" (change)="onStatusChange($any($event.target).value)">
                <option value="All Status" selected>All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

          </div>
        </div>

        <!-- Grid -->
        <div class="card-body pt-2">
          <div class="student-grid-container">
            <app-common-grid-component [GridData]="GridData" [displayedColumns]="displayedColumns"
            [displayedActions]="displayedActions" [hideColumns]="hideColumns" [totalCount]="totalCount" 
            [totalPages]="totalPages"
            (commonAction)="onCommonActionChange($event.code, $event.data)"
            (Pagechange)="onchangePage($event.pageNumber,$event.totalPages)"
            (PageSizechange)="onchangePageSize($event.pageSize)"></app-common-grid-component>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
