<!-- Export Buttons -->
<div class="d-flex justify-content-end align-items-center gap-2 mb-3">
  <button
    type="button" (click)="exportExcel()"
    class="btn btn-outline-success px-3">
    <i class="bi bi-file-earmark-excel me-2"></i>
    Excel
  </button>

  <button
    type="button"
    class="btn btn-outline-danger px-3">
    <i class="bi bi-file-earmark-pdf me-2"></i>
    PDF
  </button>
</div>

<!-- Table -->
<div class="table-responsive" id="Commongrid">
  <table class="table table-bordered table-striped align-middle mb-0">

    <!-- Header -->
    <thead class="table-light">
      <tr>
        <ng-container *ngFor="let col of displayedColumns">
          <th
            *ngIf="!hideColumns.includes(col)"
            class="text-center text-nowrap">
            {{ col | uppercase }}
          </th>
        </ng-container>

        <th
          *ngIf="displayedActions.length > 0"
          class="text-center text-nowrap">
          Actions
        </th>
      </tr>
    </thead>

    <!-- Data -->
    <tbody>
      <tr *ngFor="let row of GridData">

        <ng-container *ngFor="let col of displayedColumns">
          <td
            *ngIf="!hideColumns.includes(col)"
            class="text-center">
            {{ row[col] }}
          </td>
        </ng-container>

        <td
          *ngIf="displayedActions.length > 0"
          class="text-center">

          <select
            class="form-select form-select-sm mx-auto"
            style="max-width: 180px;"
            [(ngModel)]="row.selectedAction"
            (change)="onActionChange(row.selectedAction, row)"
          >
            <option
              *ngFor="let Action of displayedActions"
              [value]="Action.ActionCode">
              {{ Action.ActionName }}
            </option>
          </select>

        </td>

      </tr>

      <!-- No Data -->
      <tr *ngIf="GridData.length === 0">
        <td
          [attr.colspan]="
            displayedColumns.length -
            hideColumns.length +
            (displayedActions.length > 0 ? 1 : 0)
          "
          class="text-center py-3">
          No data available
        </td>
      </tr>

    </tbody>

  </table>
</div>

<div
  *ngIf="GridData.length > 0"
  class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">

  <!-- Page size -->
  <div class="d-flex align-items-center gap-2">
    <label class="mb-0">Rows per page:</label>

    <select
      class="form-select form-select-sm"
      style="width: 80px;"
      [(ngModel)]="pageSize"
      (change)="onPageSizeChange()">
<option [ngValue]="1">1</option>
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="25">25</option>
      <option [ngValue]="50">50</option>
      <option [ngValue]="100">100</option>

    </select>
  </div>

  <!-- Page information -->
  <div class="text-muted">
    Showing
    {{ (currentPage - 1) * pageSize + 1 }}
    -
    {{ Math.min(currentPage * pageSize, GridData.length) }}
    of
    {{ GridData.length }}
  </div>

  <!-- Pagination -->
  <nav>
    <ul class="pagination pagination-sm mb-0">

      <!-- Previous -->
      <li
        class="page-item"
        [class.disabled]="currentPage === 1">

        <button
          class="page-link"
          type="button"
          (click)="changePage(currentPage - 1)"
          [disabled]="currentPage === 1">
          Previous
        </button>

      </li>

      <!-- Page numbers -->
      <li
        *ngFor="let page of [].constructor(totalPages); let i = index"
        class="page-item"
        [class.active]="currentPage === i + 1">

        <button
          type="button"
          class="page-link"
          (click)="changePage(i + 1)">
          {{ i + 1 }}
        </button>

      </li>

      <!-- Next -->
      <li
        class="page-item"
        [class.disabled]="currentPage === totalPages">

        <button
          class="page-link"
          type="button"
          (click)="changePage(currentPage + 1)"
          [disabled]="currentPage === totalPages">
          Next
        </button>

      </li>

    </ul>
  </nav>

</div>
