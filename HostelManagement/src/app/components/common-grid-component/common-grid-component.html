<!-- Export Buttons -->
<div class="d-flex justify-content-end align-items-center gap-2 mb-3">
  <button
    type="button" (click)="exportExcel()"
    class="btn btn-outline-success px-3">
    <i class="bi bi-file-earmark-excel me-2"></i>
    Excel
  </button>

  <button
    type="button" (click)="exportTableToPdf()"
    class="btn btn-outline-danger px-3">
    <i class="bi bi-file-earmark-pdf me-2"></i>
    PDF
  </button>
</div>

<!-- Table -->
<div class="table-responsive" id="Commongrid">
  <table class="table table-bordered table-striped align-middle mb-0">

    <!-- Header -->
    <thead class="table-light">
      <tr>
        <ng-container *ngFor="let col of displayedColumns">
          <th
            *ngIf="!hideColumns.includes(col)"
            class="text-center text-nowrap">
            {{ col | uppercase }}
          </th>
        </ng-container>

        <th
          *ngIf="displayedActions.length > 0"
          class="text-center text-nowrap">
          Actions
        </th>
      </tr>
    </thead>

    <!-- Data -->
    <tbody>
      <tr *ngFor="let row of GridData">

        <ng-container *ngFor="let col of displayedColumns">
          <td
            *ngIf="!hideColumns.includes(col)"
            class="text-center">
            {{ row[col] }}
          </td>
        </ng-container>

        <td
          *ngIf="displayedActions.length > 0"
          class="text-center">

          <select 
            class="form-select form-select-sm mx-auto"
            style="max-width: 180px;"
            [(ngModel)]="row.selectedAction"
            (change)="onCommonActionChange(row.selectedAction, row)"
          >
          <option value="undefined">Select</option>
            <option
              *ngFor="let Action of displayedActions"
              [value]="Action.ActionCode">
              {{ Action.ActionName }}
            </option>
          </select>

        </td>

      </tr>

      <!-- No Data -->
      <tr *ngIf="GridData.length === 0">
        <td
          [attr.colspan]="
            displayedColumns.length -
            hideColumns.length +
            (displayedActions.length > 0 ? 1 : 0)
          "
          class="text-center py-3">
          No data available
        </td>
      </tr>

    </tbody>

  </table>
</div>
